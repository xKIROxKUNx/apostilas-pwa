<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fefbff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1f" />

    <meta
      http-equiv="Content-Security-Policy"
      content="

        script-src 'self' 'wasm-unsafe-eval' blob:;
        worker-src 'self' blob:;
        style-src 'self' 'unsafe-inline';
        font-src 'self' data:;
        img-src 'self' data: blob:;
        connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firebasestorage.googleapis.com https://firestore.googleapis.com;
        object-src 'none';
        base-uri 'self';
        form-action 'none';
      "
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apostilas" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <meta name="robots" content="noindex, nofollow" />

    <title>Apostilas</title>
    <script src="%BASE_URL%theme-boot.js"></script>
